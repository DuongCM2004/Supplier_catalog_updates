# Render Blueprint: one Docker web service plus a free managed PostgreSQL.
# Apply it from the Render dashboard (New > Blueprint); README section "Deploy to Render".
services:
  - type: web
    name: resilient-catalog-sync
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Internal connection string of the database below. The app listens on the PORT
      # that Render injects, so HTTP_ADDR is deliberately not set.
      - key: DATABASE_URL
        fromDatabase:
          name: resilient-catalog-db
          property: connectionString
      # Render generates the secret on first deploy; POST routes require it as a bearer token.
      - key: API_TOKEN
        generateValue: true
      - key: SUPPLIER_ID
        value: SUP-001

databases:
  - name: resilient-catalog-db
    plan: free
    postgresMajorVersion: "17"
    # Only the web service (private network) may connect; no external access.
    ipAllowList: []

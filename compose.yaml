# One API container plus PostgreSQL on a named volume. Recovery after a crash is
# application logic (reconcile + explicit resume), so the app has no restart policy.
# Other projects (gates, demo, smoke, clean clone) override the name with COMPOSE_PROJECT_NAME.
name: catalog-sync

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8088}:8080"
    environment:
      DATABASE_URL: postgres://catalog:catalog@db:5432/catalog?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_TOKEN: ${API_TOKEN:-}
      SUPPLIER_OUTAGE_CURSORS: ${SUPPLIER_OUTAGE_CURSORS:-}
      SUPPLIER_DELAY_MS: ${SUPPLIER_DELAY_MS:-0}
      CRASH_POINT: ${CRASH_POINT:-}
    restart: "no"

volumes:
  pgdata: {}
